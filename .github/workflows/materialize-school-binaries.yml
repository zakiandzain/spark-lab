name: Materialize school binaries
on:
  workflow_dispatch:
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode staged base64 into binary paths
        run: |
          set -euo pipefail
          python3 << 'PY'
          import json, base64
          from pathlib import Path
          root = Path('.staging')
          manifest = json.loads((root / 'manifest.json').read_text())
          for item in manifest:
              dest = Path(item['dest'])
              parts_dir = root / dest
              chunks = []
              for i in range(item['parts']):
                  chunks.append((parts_dir / f'part{i:03d}').read_text().strip())
              data = base64.b64decode(''.join(chunks))
              if len(data) != item['bytes']:
                  raise SystemExit(f"size mismatch {dest}: got {len(data)} expected {item['bytes']}")
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(data)
              print(f'wrote {dest} ({len(data)} bytes)')
          PY
      - name: Commit binaries and remove staging
        run: |
          set -euo pipefail
          rm -rf .staging
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add school chemistry PDFs and femi source PNGs"
          git push origin HEAD:main
