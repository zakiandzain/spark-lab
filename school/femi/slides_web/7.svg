  <g font-family="Georgia, serif">
    <text x="60" y="70" font-size="28" font-weight="700" fill="#111">Spiritual Beliefs</text><text x="60" y="120" font-size="18" fill="#222">**Spirituality and Values**</text><text x="60" y="162" font-size="18" fill="#222">Spiritual beliefs vary widely among Native American communities and</text><text x="60" y="190" font-size="18" fill="#222">often emphasize respect for nature, balance, and harmony.</text><text x="60" y="232" font-size="18" fill="#222">These beliefs are deeply connected to cultural traditions and daily</text><text x="60" y="260" font-size="18" fill="#222">life.</text>
  </g>
