    <text x="60" y="70" font-size="28" font-weight="700" fill="#111">History and Resilience</text><text x="60" y="120" font-size="18" fill="#222">Native American communities have faced many historical challenges</text><text x="60" y="148" font-size="18" fill="#222">while continuing to preserve their cultures and identities.</text><text x="60" y="190" font-size="18" fill="#222">Their resilience remains an important part of their story today.</text>
