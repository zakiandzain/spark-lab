  <g font-family="Georgia, serif">
    <text x="60" y="70" font-size="28" font-weight="700" fill="#111">Community Life</text><text x="60" y="120" font-size="18" fill="#222">Community and family relationships are central in many Native American</text><text x="60" y="148" font-size="18" fill="#222">cultures, supporting cooperation, respect, and shared</text><text x="60" y="176" font-size="18" fill="#222">responsibilities.</text><text x="60" y="218" font-size="18" fill="#222">Daily life has traditionally been shaped by environment, traditions,</text><text x="60" y="246" font-size="18" fill="#222">and social values.</text>
  </g>
